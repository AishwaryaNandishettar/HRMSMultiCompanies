spring.application.name=HRMS-Backend
server.port=${PORT:8082}

spring.jackson.time-zone=Asia/Kolkata
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.uri=${MONGODB_URI}

# ===============================
# SENDGRID EMAIL CONFIGURATION
# ===============================
sendgrid.api.key=${SENDGRID_API_KEY}
meeting.email.from-address=${MEETING_EMAIL_FROM_ADDRESS:aishushettar95@gmail.com}
meeting.email.from-name=HRMS - Omoikane Innovations
meeting.email.reply-to=${MEETING_EMAIL_FROM_ADDRESS:aishushettar95@gmail.com}

# ===============================
# SMTP (kept for JavaMailSender bean - not used for sending)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MEETING_EMAIL_FROM_ADDRESS:aishushettar95@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_not_used}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# IMPORTANT: Disable SQL Auto Config
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.data.jpa.repositories.enabled=false

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:MyFixedSecretKey123456}
jwt.expiration=86400

# ===============================
# CORS CONFIGURATION
# ===============================
app.cors.allowedOrigins=http://localhost:5173,https://omoi-hrms.vercel.app,https://hrms-frontend-production.vercel.app

# ===============================
# FRONTEND URL
# ===============================
frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8082}

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===============================
# ASYNC CONFIGURATION
# ===============================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-async-

# ===============================
# MEETING EMAIL REMINDERS
# ===============================
meeting.email.reminders.enabled=true
meeting.email.reminders.times=1440,60,15
meeting.email.reminders.batch-size=50
meeting.email.rate-limit.enabled=true
meeting.email.rate-limit.max-per-minute=30
meeting.email.rate-limit.max-per-hour=500
meeting.email.base-url=http://localhost:5176

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ===============================
# LIVEKIT
# ===============================
livekit.url=ws://localhost:7880
livekit.api-key=devkey
livekit.api-secret=devsecret12345678901234567

# ===============================
# TWILIO SMS
# ===============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}
twilio.enabled=true
twilio.verified.numbers=${TWILIO_VERIFIED_NUMBERS:+919606408912,+919930145419}

# ===============================
# MSG91 SMS
# ===============================
msg91.authkey=523182AORxp3aywDyl6a23a208P1
msg91.sender.id=HRMSYS
msg91.enabled=true
