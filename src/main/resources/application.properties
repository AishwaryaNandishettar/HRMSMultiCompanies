spring.application.name=HRMS-Backend
server.port=8082

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG

# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=Data_base_hrms

# ===============================
# MAIL CONFIGURATION (OTP / ONBOARDING)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aishushettar95@gmail.com
spring.mail.password=uibswyvitauzsjjf

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# IMPORTANT: Disable SQL Auto Config
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

jwt.secret=MyFixedSecretKey123456
jwt.expiration=86400

# SSL Trust Configuration (for development) - WORKING!
spring.mail.properties.mail.smtp.ssl.trust=*

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.debug=true

# Email Retry Configuration
spring.mail.properties.mail.smtp.retry.count=3
spring.mail.properties.mail.smtp.retry.delay=2000

# Email Template Configuration
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF-8

# ===============================
# ASYNC CONFIGURATION
# ===============================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-async-

# ===============================
# MEETING EMAIL CONFIGURATION
# ===============================
meeting.email.from-name=HRMS Meeting System
meeting.email.from-address=aishwarya.n@omoikaneinnovations.com
meeting.email.reply-to=noreply@omoikaneinnovations.com
meeting.email.base-url=http://localhost:5176

meeting.email.reminders.enabled=true
meeting.email.reminders.times=1440,60,15
meeting.email.reminders.batch-size=50

meeting.email.rate-limit.enabled=true
meeting.email.rate-limit.max-per-minute=30
meeting.email.rate-limit.max-per-hour=500

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ===============================
# LIVEKIT SFU CONFIGURATION
# ===============================
livekit.url=ws://localhost:7880
livekit.api-key=devkey
livekit.api-secret=devsecret12345678901234567
