spring.application.name=HRMS-Backend
server.port=8082

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.com.omoikaneinnovation.hmrsbackend.service=DEBUG

# ===============================
# MongoDB Configuration
# ===============================
# For production (Render/Railway), set MONGODB_URI environment variable
# For local development, use MongoDB Atlas cloud database
spring.data.mongodb.uri=${MONGODB_URI}

# ===============================
# SENDGRID EMAIL CONFIGURATION
# ===============================

sendgrid.enabled=${SENDGRID_ENABLED:true}
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:aishushettar95@gmail.com}
sendgrid.from.name=${SENDGRID_FROM_NAME:HRMS System}






# ===============================
# IMPORTANT: Disable SQL Auto Config
# ===============================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

jwt.secret=MyFixedSecretKey123456
jwt.expiration=86400



# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false






# ===============================
# ASYNC CONFIGURATION
# ===============================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-async-

# ===============================
# MEETING EMAIL
# ===============================
meeting.email.from-name=HRMS Meeting System
meeting.email.from-address=${SENDGRID_FROM_EMAIL:aishushettar95@gmail.com}
meeting.email.reply-to=${SENDGRID_FROM_EMAIL:aishushettar95@gmail.com}
meeting.email.base-url=${FRONTEND_URL:https://omoi-hrms.vercel.app}


meeting.email.reminders.enabled=true
meeting.email.reminders.times=1440,60,15
meeting.email.reminders.batch-size=50

meeting.email.rate-limit.enabled=true
meeting.email.rate-limit.max-per-minute=30
meeting.email.rate-limit.max-per-hour=500

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# ===============================
# LIVEKIT SFU CONFIGURATION
# ===============================
livekit.url=ws://localhost:7880
livekit.api-key=devkey
livekit.api-secret=devsecret12345678901234567


# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ===============================
# FRONTEND URL CONFIGURATION
# For localhost: http://localhost:5173
# For Vercel deployment: Set FRONTEND_URL environment variable
# Example: FRONTEND_URL=https://your-app.vercel.app
# ===============================
frontend.url=${FRONTEND_URL:https://omoi-hrms.vercel.app}
